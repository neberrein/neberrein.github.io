name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and build measured MANTA results when CSV is present
        run: |
          python scripts/test_manta_results.py
          python scripts/test_manta_hybrid.py
          python scripts/test_manta_dvo.py
          python scripts/build_manta_results.py
      - name: Validate static project navigation
        run: |
          python scripts/test_project_navigation.py
          python scripts/update_project_navigation.py --check
      - name: Validate portfolio sharing and presentation
        run: python scripts/test_portfolio_presentation.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
