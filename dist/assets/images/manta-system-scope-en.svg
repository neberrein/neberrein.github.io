<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">MANTA system connections and my scope</title><desc id="desc">My module takes BlueROV2 and torpedo states, decides whether to evade, generates a path with A* or DVO, and outputs the avoidance path. The path-following and control module turns it into Gazebo vehicle motion.</desc>
