<text x="60" y="50" text-anchor="start" font-size="32" fill="#21457c">대상을 놓친 경우</text><rect x="90" y="90" width="540" height="115" rx="12" fill="#fff" stroke="#b86612" stroke-width="2"/><text x="360" y="135" text-anchor="middle" font-size="34" fill="#18345f">대상 소실</text><text x="360" y="178" text-anchor="middle" font-size="30" fill="#53677c">일정 시간 미검출</text><path d="M360 205V260" fill="none" stroke="#2f63b4" stroke-width="3"  marker-end="url(#blue)"/><rect x="90" y="260" width="540" height="115" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/><text x="360" y="305" text-anchor="middle" font-size="34" fill="#18345f">자동 추종 중단</text><text x="360" y="348" text-anchor="middle" font-size="30" fill="#53677c">위치 유지 요청</text><path d="M360 375V430" fill="none" stroke="#2f63b4" stroke-width="3"  marker-end="url(#blue)"/><rect x="90" y="430" width="540" height="115" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/><text x="360" y="475" text-anchor="middle" font-size="34" fill="#18345f">비행 상태 확인</text><text x="360" y="518" text-anchor="middle" font-size="30" fill="#53677c">Hold 전환 확인</text><path d="M360 545V600" fill="none" stroke="#2f63b4" stroke-width="3"  marker-end="url(#blue)"/><rect x="90" y="600" width="540" height="115" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/><text x="360" y="645" text-anchor="middle" font-size="34" fill="#18345f">대상 재탐지</text><text x="360" y="688" text-anchor="middle" font-size="30" fill="#53677c">재개 조건 확인</text><path d="M360 715V770" fill="none" stroke="#2f63b4" stroke-width="3"  marker-end="url(#blue)"/><rect x="90" y="770" width="540" height="115" rx="12" fill="#fff" stroke="#138a98" stroke-width="2"/><text x="360" y="815" text-anchor="middle" font-size="34" fill="#18345f">추종 재개</text><text x="360" y="858" text-anchor="middle" font-size="30" fill="#53677c">조건 충족 시</text><rect x="55" y="980" width="610" height="145" rx="12" fill="#edf3f8" stroke="#cfdae5" stroke-width="2"/><text x="360" y="1025" text-anchor="middle" font-size="34" fill="#18345f">사용자 수동 개입</text><text x="360" y="1070" text-anchor="middle" font-size="30" fill="#53677c">현재 상태와 관계없이</text><text x="360" y="1107" text-anchor="middle" font-size="32" fill="#18345f">자동 추종 해제</text>
</svg>
