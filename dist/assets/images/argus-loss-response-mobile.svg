<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1520" viewBox="0 0 720 1520" role="img" aria-labelledby="title desc">
  <title id="title">ARGUS 모바일 추종 상태 전이와 대상 소실 대응</title>
  <desc id="desc">정상 추종, 대상 소실, 추종 판단 무효화, Hold 요청, FC 상태 확인, 재탐지와 추종 재개 순서를 세로로 표시한 초기 안전 흐름 설계안</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6f8195"/></marker>
    <style>
      text{font-family:Pretendard,"Noto Sans KR",sans-serif;fill:#18345f}.box{fill:#fff;stroke:#cfdae5;stroke-width:3}.active{fill:#e5eff8;stroke:#9db8d0;stroke-width:3}.warn{fill:#fff;stroke:#c47719;stroke-width:4}.label{font-size:30px;font-weight:750}.sub{font-size:25px;fill:#64758b}.tag{font-size:24px;font-weight:850}.flow{fill:none;stroke:#6f8195;stroke-width:5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="720" height="1520" fill="#fff"/>
  <text x="50" y="55" class="tag" fill="#168ba6">초기 안전 흐름 설계안</text>
  <text x="50" y="115" class="tag">정상 추종</text>
  <rect x="95" y="145" width="530" height="115" rx="16" class="box"/><text x="360" y="215" text-anchor="middle" class="label">장치 점검과 시작 요청</text>
  <path d="M360 260V310" class="flow"/>
  <rect x="95" y="315" width="530" height="115" rx="16" class="box"/><text x="360" y="385" text-anchor="middle" class="label">FC 상태 확인</text>
  <path d="M360 430V480" class="flow"/>
  <rect x="95" y="485" width="530" height="115" rx="16" class="active"/><text x="360" y="555" text-anchor="middle" class="label">추종 (FOLLOW)</text>
  <path d="M360 600V650" fill="none" stroke="#c47719" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="50" y="690" class="tag" fill="#b86612">대상 소실과 수동 개입</text>
  <rect x="95" y="720" width="530" height="120" rx="16" class="warn"/><text x="360" y="770" text-anchor="middle" class="label">대상 소실</text><text x="360" y="810" text-anchor="middle" class="sub">관측 만료 또는 수동 개입</text>
  <path d="M360 840V890" class="flow"/>
  <rect x="95" y="895" width="530" height="120" rx="16" class="box"/><text x="360" y="945" text-anchor="middle" class="label">추종 판단 무효화</text><text x="360" y="985" text-anchor="middle" class="sub">Hold 또는 정지 요청</text>
  <path d="M360 1015V1065" class="flow"/>
  <rect x="95" y="1070" width="530" height="120" rx="16" class="box"/><text x="360" y="1120" text-anchor="middle" class="label">실제 FC 상태 확인</text><text x="360" y="1160" text-anchor="middle" class="sub">Hold 확인</text>
  <path d="M360 1190V1240" class="flow"/>
  <text x="50" y="1280" class="tag" fill="#138a98">재탐지와 재추종</text>
  <rect x="95" y="1310" width="530" height="120" rx="16" class="box"/><text x="360" y="1360" text-anchor="middle" class="label">재탐지와 시작 조건 확인</text><text x="360" y="1400" text-anchor="middle" class="sub">조건 충족 시 추종 재개</text>
  <text x="50" y="1490" class="sub">수동 개입 시 모든 상태에서 추종 해제</text>
</svg>
