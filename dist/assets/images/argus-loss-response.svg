<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">표적 관리 상태와 수동 개입 대응</title><desc id="desc">대상을 놓쳤을 때 표적 관리 상태가 바뀌는 순서와 사용자 수동 개입 처리를 나타냅니다.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2f63b4"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#b86612"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#697e91"/></marker></defs>
<style>text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;font-weight:650}.st{font-size:21px;fill:#18345f}.code{font-size:15px;fill:#53677c;letter-spacing:.04em}.lb{font-size:16px;fill:#21457c}.lb-muted{font-size:16px;fill:#53677c}.lb-amber{font-size:16px;fill:#b86612}</style>
<rect width="1200" height="640" fill="#fff"/>
<rect x="20" y="20" width="1160" height="470" rx="14" fill="#f5f8fb" stroke="#c4d3e3" stroke-width="2"/>
<text x="44" y="58" font-size="22" fill="#21457c">대상을 놓친 경우</text><text x="1156" y="58" text-anchor="end" font-size="16" fill="#53677c">표적 관리 상태</text>
<path d="M950 120V92H140V118" fill="none" stroke="#2f63b4" stroke-width="3" marker-end="url(#blue)"/>
<text x="545" y="82" text-anchor="middle" class="lb">3프레임 연속 확인과 이동 검증 통과</text>
<rect x="50" y="120" width="180" height="80" rx="12" fill="#fff" stroke="#2f63b4" stroke-width="2.5"/><text x="140" y="155" text-anchor="middle" class="st">표적 고정</text><text x="140" y="182" text-anchor="middle" class="code">LOCKED</text>
<path d="M230 150H318" fill="none" stroke="#2f63b4" stroke-width="3" marker-end="url(#blue)"/><text x="274" y="138" text-anchor="middle" class="lb">관측 끊김</text>
<rect x="320" y="120" width="180" height="80" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/><text x="410" y="155" text-anchor="middle" class="st">관측 공백 대기</text><text x="410" y="182" text-anchor="middle" class="code">GAP_HOLD</text>
<path d="M500 150H588" fill="none" stroke="#2f63b4" stroke-width="3" marker-end="url(#blue)"/><text x="544" y="138" text-anchor="middle" class="lb">후보 검색</text>
<rect x="590" y="120" width="180" height="80" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/><text x="680" y="155" text-anchor="middle" class="st">재획득 후보 탐색</text><text x="680" y="182" text-anchor="middle" class="code">REACQUIRE</text>
<path d="M770 145H858" fill="none" stroke="#2f63b4" stroke-width="3" marker-end="url(#blue)"/><text x="814" y="133" text-anchor="middle" class="lb">후보 1개</text>
<path d="M860 180H772" fill="none" stroke="#697e91" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#gray)"/><text x="814" y="206" text-anchor="middle" class="lb-muted">검증 실패</text>
<rect x="860" y="120" width="180" height="80" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/><text x="950" y="155" text-anchor="middle" class="st">후보 확인</text><text x="950" y="182" text-anchor="middle" class="code">CONFIRM</text>
<path d="M410 200V340H588" fill="none" stroke="#b86612" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#amber)"/>
<path d="M650 200V298" fill="none" stroke="#b86612" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#amber)"/>
<path d="M950 200V340H772" fill="none" stroke="#b86612" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#amber)"/>
<text x="638" y="262" text-anchor="end" class="lb-amber">4초 초과</text>
<rect x="590" y="300" width="180" height="80" rx="12" fill="#fff" stroke="#b86612" stroke-width="2.5"/><text x="680" y="335" text-anchor="middle" class="st">표적 상실</text><text x="680" y="362" text-anchor="middle" class="code">LOST</text>
<rect x="50" y="412" width="1100" height="54" rx="10" fill="#fff" stroke="#cfdae5" stroke-width="2"/>
<text x="600" y="434" text-anchor="middle" font-size="16" fill="#18345f">표적 고정일 때만 이동 명령을 만들고, 공백 대기, 탐색, 확인 중에는 속도 0으로 제자리에서 기다립니다.</text><text x="600" y="456" text-anchor="middle" font-size="16" fill="#18345f">4초 안에 다시 고정하지 못하면 표적 상실로 보고 PX4를 위치 유지(Hold)로 바꾸며, 사용자가 다시 골라야 재개합니다.</text>
<rect x="20" y="510" width="1160" height="110" rx="14" fill="#edf3f8" stroke="#b8cbe0" stroke-width="2"/>
<text x="44" y="548" font-size="20" fill="#21457c">사용자가 수동으로 개입한 경우</text>
<rect x="50" y="562" width="200" height="44" rx="10" fill="#fff" stroke="#2f63b4" stroke-width="2"/><text x="150" y="591" text-anchor="middle" font-size="19" fill="#18345f">수동 개입</text>
<path d="M250 584H338" fill="none" stroke="#2f63b4" stroke-width="3" marker-end="url(#blue)"/>
<text x="352" y="591" text-anchor="start" font-size="20" fill="#21457c">현재 상태와 관계없이 자동 추종 해제</text>
</svg>
