<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">대상 소실과 사용자 수동 개입을 구분한 대응 설계</title><desc id="desc">화살표는 데이터 또는 명령의 전달 방향을 나타냅니다.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2f63b4"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#138a98"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#697e91"/></marker></defs>
<style>text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;font-weight:650}</style>
<rect width="1200" height="580" fill="#fff"/>
<text x="40" y="65" text-anchor="start" font-size="26" fill="#21457c">대상을 놓친 경우</text><rect x="40" y="120" width="200" height="150" rx="12" fill="#fff" stroke="#b86612" stroke-width="2"/><text x="140" y="177" text-anchor="middle" font-size="24" fill="#18345f">대상 소실</text><text x="140" y="224" text-anchor="middle" font-size="21" fill="#53677c">일정 시간 미검출</text><path d="M240 190H270" fill="none" stroke="#2f63b4" stroke-width="3"  marker-end="url(#blue)"/><rect x="270" y="120" width="200" height="150" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/><text x="370" y="177" text-anchor="middle" font-size="24" fill="#18345f">자동 추종 중단</text><text x="370" y="224" text-anchor="middle" font-size="21" fill="#53677c">위치 유지 요청</text><path d="M470 190H500" fill="none" stroke="#2f63b4" stroke-width="3"  marker-end="url(#blue)"/><rect x="500" y="120" width="200" height="150" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/><text x="600" y="177" text-anchor="middle" font-size="24" fill="#18345f">비행 상태 확인</text><text x="600" y="224" text-anchor="middle" font-size="21" fill="#53677c">Hold 전환 확인</text><path d="M700 190H730" fill="none" stroke="#2f63b4" stroke-width="3"  marker-end="url(#blue)"/><rect x="730" y="120" width="200" height="150" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/><text x="830" y="177" text-anchor="middle" font-size="24" fill="#18345f">대상 재탐지</text><text x="830" y="224" text-anchor="middle" font-size="21" fill="#53677c">재개 조건 확인</text><path d="M930 190H960" fill="none" stroke="#2f63b4" stroke-width="3"  marker-end="url(#blue)"/><rect x="960" y="120" width="200" height="150" rx="12" fill="#fff" stroke="#138a98" stroke-width="2"/><text x="1060" y="177" text-anchor="middle" font-size="24" fill="#18345f">추종 재개</text><text x="1060" y="224" text-anchor="middle" font-size="21" fill="#53677c">조건 충족 시</text><rect x="40" y="365" width="1120" height="150" rx="12" fill="#edf3f8" stroke="#cfdae5" stroke-width="2"/><text x="75" y="410" text-anchor="start" font-size="26" fill="#21457c">사용자가 수동으로 개입한 경우</text><text x="205" y="470" text-anchor="middle" font-size="26" fill="#18345f">수동 개입</text><path d="M320 460H430" fill="none" stroke="#697e91" stroke-width="3"  marker-end="url(#gray)"/><text x="460" y="470" text-anchor="start" font-size="26" fill="#18345f">현재 상태와 관계없이 자동 추종 해제</text>
</svg>
