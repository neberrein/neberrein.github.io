<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Processing order from the latest frame to PX4 flight control</title><desc id="desc">Arrows show the direction in which data or commands are passed.</desc>
