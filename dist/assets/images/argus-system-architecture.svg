nchor="end" font-size="22" fill="#21457c">입력 영상</text><path d="M670 395V275" fill="none" stroke="#2f63b4" stroke-width="3"  marker-end="url(#blue)"/><text x="692" y="365" text-anchor="start" font-size="22" fill="#21457c">추론 결과</text><rect x="60" y="610" width="330" height="115" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/><text x="225" y="655" text-anchor="middle" font-size="26" fill="#18345f">지상 통제기</text><text x="225" y="695" text-anchor="middle" font-size="21" fill="#53677c">영상 확인 / 기록 / 운용 요청</text><path d="M420 245H315V530H155V610" fill="none" stroke="#697e91" stroke-width="3"  marker-end="url(#gray)"/><text x="145" y="500" text-anchor="middle" font-size="23" fill="#18345f">영상과 상태</text><path d="M270 610V580H375V300H455V275" fill="none" stroke="#2f63b4" stroke-width="3"  marker-end="url(#blue)"/><text x="450" y="605" text-anchor="start" font-size="22" fill="#21457c">선택 / 시작 / 중단</text><text x="665" y="655" text-anchor="middle" font-size="23" fill="#2f63b4">본인 담당</text><text x="665" y="695" text-anchor="middle" font-size="23" fill="#18345f">YOLOX 학습과 Hailo NPU 적용</text>
