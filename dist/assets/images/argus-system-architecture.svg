<rect x="579" y="560" width="300" height="110" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/>
<text x="729" y="606" text-anchor="middle" font-size="25" fill="#18345f">지상 통제기</text><text x="729" y="644" text-anchor="middle" font-size="19" fill="#53677c">영상과 박스 확인 / 표적 선택</text>
<rect x="40" y="602" width="80" height="26" rx="13" fill="#2f63b4"/><text x="80" y="620" text-anchor="middle" font-size="14" fill="#fff">본인 담당</text>
<text x="132" y="621" text-anchor="start" font-size="17" fill="#18345f">YOLOX 학습, Hailo NPU 적용, 다중 추적과 표적 재획득</text>
