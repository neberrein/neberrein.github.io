<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="630" viewBox="0 0 1600 630" role="img" aria-labelledby="title desc">
  <title id="title">ARGUS 초기 시스템 구조</title>
  <desc id="desc">LWIR 카메라 영상이 Raspberry Pi 5와 Hailo NPU를 거쳐 탐지, 추적, 추종 판단으로 처리되고 PX4 비행 제어와 지상 통제기에 연결되는 구조</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2f63b4"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#138a98"/></marker>
    <style>
      text{font-family:Pretendard,"Noto Sans KR",sans-serif;fill:#18345f} .box{fill:#fff;stroke:#cfdae5;stroke-width:2}.soft{fill:#edf3f8}.label{font-size:24px;font-weight:700}.sub{font-size:19px;fill:#64758b}.small{font-size:17px;font-weight:700}.blue{stroke:#2f63b4}.teal{stroke:#138a98}.line{fill:none;stroke-width:4;marker-end:url(#arrow-blue)}
    </style>
  </defs>
  <rect width="1600" height="720" fill="#fff"/>
  <text x="60" y="48" class="small" fill="#168ba6">온보드 시스템 구조</text>
  <rect x="60" y="110" width="240" height="185" rx="10" class="box"/>
  <text x="180" y="175" text-anchor="middle" class="label">LWIR 카메라</text><text x="180" y="215" text-anchor="middle" class="sub">기체 전방 장착</text><text x="180" y="250" text-anchor="middle" class="sub">적외선 영상 입력</text>
  <rect x="390" y="65" width="570" height="470" rx="14" class="soft" stroke="#b8cbe0" stroke-width="2"/>
  <text x="430" y="115" class="label">Raspberry Pi 5</text>
  <rect x="440" y="155" width="470" height="110" rx="9" class="box"/><text x="675" y="222" text-anchor="middle" class="label">영상 수신 → 전처리</text>
  <rect x="440" y="345" width="470" height="130" rx="9" class="box"/><text x="675" y="400" text-anchor="middle" class="label">후처리 → 추적</text><text x="675" y="440" text-anchor="middle" class="label">→ 추종 판단</text>
  <rect x="1070" y="70" width="450" height="175" rx="10" class="box"/><rect x="1070" y="70" width="10" height="175" fill="#2f63b4"/><text x="1125" y="130" class="label">Hailo NPU</text><text x="1125" y="180" class="sub">YOLOX 신경망 추론</text><text x="1125" y="217" class="small">본인 담당 · YOLOX 학습 / NPU 적용</text>
  <rect x="1070" y="345" width="450" height="190" rx="10" class="box"/><rect x="1070" y="345" width="10" height="190" fill="#138a98"/><text x="1125" y="405" class="label">FC / PX4</text><text x="1125" y="445" class="sub">자세와 속도 제어</text><text x="1125" y="480" class="sub">실제 비행 상태 확인</text>
  <rect x="60" y="400" width="240" height="190" rx="10" class="box"/><text x="180" y="465" text-anchor="middle" class="label">지상 통제기</text><text x="180" y="505" text-anchor="middle" class="sub">Windows / PyQt</text><text x="180" y="540" text-anchor="middle" class="sub">표시, 기록, 운용 요청</text>
  <path d="M300 205H440" class="line blue"/><text x="370" y="185" text-anchor="middle" class="small">USB 영상</text>
  <path d="M910 205H1070" class="line blue"/><text x="990" y="180" text-anchor="middle" class="small">입력 텐서</text>
  <path d="M1290 245V305H910V370" class="line blue"/><text x="1125" y="290" text-anchor="middle" class="small">추론 결과</text>
  <path d="M910 420H1070" class="line teal" style="marker-end:url(#arrow-teal)"/><text x="990" y="397" text-anchor="middle" class="small">MAVSDK 속도 명령</text>
  <path d="M1070 465H955" fill="none" stroke="#138a98" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-teal)"/><text x="1005" y="500" text-anchor="middle" class="small">상태와 모드</text>
  <path d="M440 410H300" fill="none" stroke="#7b8997" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="370" y="390" text-anchor="middle" class="small">영상과 상태</text>
  <path d="M300 520H440" class="line blue"/><text x="370" y="555" text-anchor="middle" class="small">선택, 시작, 중단</text>
</svg>
