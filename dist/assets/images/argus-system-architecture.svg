<path d="M700 280V588" fill="none" stroke="#697e91" stroke-width="3" marker-end="url(#gray)"/>
<path d="M746 590V282" fill="none" stroke="#2f63b4" stroke-width="3" marker-end="url(#blue)"/>
<text x="688" y="535" text-anchor="end" font-size="19" fill="#53677c">영상과 탐지, 추적 결과</text>
<text x="758" y="548" text-anchor="start" class="label">표적 선택 / 시작 / 중단</text>
<text x="688" y="567" text-anchor="end" font-size="17" fill="#53677c">UDP (무선)</text>
<text x="758" y="580" text-anchor="start" font-size="17" fill="#53677c">MAVLink (UDP)</text>
<rect x="579" y="590" width="300" height="110" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/>
<text x="729" y="636" text-anchor="middle" font-size="25" fill="#18345f">지상 통제기</text><text x="729" y="674" text-anchor="middle" font-size="19" fill="#53677c">영상 확인과 표적 선택</text>
<rect x="40" y="745" width="80" height="26" rx="13" fill="#2f63b4"/><text x="80" y="763" text-anchor="middle" font-size="14" fill="#fff">본인 담당</text>
<text x="132" y="764" text-anchor="start" font-size="19" fill="#18345f">YOLOX 학습과 NPU 최적화, 다중 표적 추적과 재획득</text>
