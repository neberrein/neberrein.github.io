<path d="M746 560V242" fill="none" stroke="#2f63b4" stroke-width="3" marker-end="url(#blue)"/>
<rect x="670" y="452" width="60" height="26" rx="13" class="pill"/><text x="700" y="470" text-anchor="middle" class="pill-text">RTSP</text><rect x="719" y="496" width="54" height="26" rx="13" class="pill"/><text x="746" y="514" text-anchor="middle" class="pill-text">UDP</text>
<text x="688" y="535" text-anchor="end" font-size="19" fill="#53677c">영상과 탐지, 추적 결과</text>
