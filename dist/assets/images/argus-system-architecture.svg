<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">온보드 장치 구성과 데이터 연결</title><desc id="desc">화살표는 데이터 또는 명령의 전달 방향을, 흰 표시는 연결 방식을 나타냅니다.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2f63b4"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#138a98"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#697e91"/></marker></defs>
<style>text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;font-weight:650}.pill{fill:#fff;stroke:#c4d3e3;stroke-width:1.5}.pill-text{font-size:15px;fill:#53677c;font-weight:700}.label{font-size:19px;fill:#18345f}.sub{font-size:20px;fill:#53677c}</style>
<rect width="1200" height="720" fill="#fff"/>
<rect x="30" y="40" width="1140" height="450" rx="14" fill="#edf3f8" stroke="#b8cbe0" stroke-width="2"/>
<text x="60" y="82" font-size="22" fill="#21457c">기체 탑재 장치</text>
<rect x="60" y="120" width="210" height="120" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/>
<text x="165" y="170" text-anchor="middle" font-size="25" fill="#18345f">LWIR 카메라</text><text x="165" y="208" text-anchor="middle" class="sub">열화상 영상</text>
<rect x="430" y="120" width="330" height="120" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/>
<text x="595" y="168" text-anchor="middle" font-size="26" fill="#18345f">Raspberry Pi 5</text><text x="595" y="206" text-anchor="middle" class="sub">전처리 / <tspan fill="#2f63b4" font-weight="800">추적과 재획득</tspan> / 추종 판단</text>
<rect x="930" y="120" width="210" height="120" rx="12" fill="#fff" stroke="#138a98" stroke-width="2"/>
<text x="1035" y="168" text-anchor="middle" font-size="25" fill="#18345f">비행 제어기</text><text x="1035" y="208" text-anchor="middle" font-size="22" fill="#138a98">PX4</text>
<rect x="430" y="330" width="230" height="115" rx="12" fill="#fff" stroke="#2f63b4" stroke-width="2.5"/>
<text x="545" y="380" text-anchor="middle" font-size="25" fill="#18345f">Hailo NPU</text><text x="545" y="417" text-anchor="middle" font-size="21" fill="#2f63b4">YOLOX 추론</text>
<rect x="572" y="317" width="80" height="26" rx="13" fill="#2f63b4"/><text x="612" y="335" text-anchor="middle" font-size="14" fill="#fff">본인 담당</text>
<path d="M270 180H428" fill="none" stroke="#2f63b4" stroke-width="3" marker-end="url(#blue)"/>
<text x="350" y="166" text-anchor="middle" class="label">영상</text>
<rect x="323" y="193" width="54" height="26" rx="13" class="pill"/><text x="350" y="211" text-anchor="middle" class="pill-text">USB</text>
