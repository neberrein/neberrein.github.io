<path d="M930 206H762" fill="none" stroke="#138a98" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#teal)"/>
<text x="845" y="146" text-anchor="middle" class="label">추종 명령</text>
<text x="845" y="234" text-anchor="middle" font-size="19" fill="#53677c">비행 상태</text>
<rect x="800" y="170" width="90" height="26" rx="13" class="pill"/><text x="845" y="188" text-anchor="middle" class="pill-text">MAVLink</text>
