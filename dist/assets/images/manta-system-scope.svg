<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc"><title id="title">MANTA 시스템 연결과 담당 범위</title><desc id="desc">BlueROV2와 어뢰 상태를 받아 담당 영역에서 위협 판단, A* 또는 DVO 경로 생성, 회피 경로 출력을 수행합니다. 팀의 경로 추종과 제어 모듈이 이를 Gazebo 기체의 움직임으로 연결합니다.</desc>
