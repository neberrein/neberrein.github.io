<text x="24" y="38" font-size="22" fill="#23774a" font-weight="700" text-anchor="start">DVO / Short-range avoidance path</text>
<path d="M65 315L390 95" fill="none" stroke="#8795a1" stroke-width="2" stroke-dasharray="7 6"/>
<text x="270" y="291" font-size="18" fill="#536574" font-weight="400" text-anchor="start">Mission path</text>
<path d="M350 274H425V145L355 119" fill="none" stroke="#8795a1" stroke-width="1" stroke-dasharray=""/>
