<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Onboard hardware and ground control station links</title><desc id="desc">The Pi sends video, detections and tracks to the ground control station, which sends the selected target and start or stop requests back to the Pi. The Pi and PX4 exchange commands and status over MAVLink UART.</desc>
