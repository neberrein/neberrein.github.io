<circle cx="390" cy="95" r="8" fill="#193044"/>
<text x="352" y="76" font-size="18" fill="#193044" font-weight="700" text-anchor="start">임무 목표</text>
<rect x="245" y="204" width="40" height="34" rx="8" fill="#f6d9d6" stroke="#c7776b" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="190" y="230" width="40" height="34" rx="8" fill="#f6d9d6" stroke="#c7776b" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="135" y="256" width="40" height="34" rx="8" fill="#f6d9d6" stroke="#c7776b" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="202" y="365" font-size="19" fill="#a83b38" font-weight="400" text-anchor="start">예상 위험 영역</text>
<path d="M257 343L210 266" fill="none" stroke="#a83b38" stroke-width="1" stroke-dasharray=""/>
<path d="M65 315C87 248 93 160 156 97S278 54 390 95" fill="none" stroke="#2b73b8" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="35" y="429" font-size="19" fill="#2b73b8" font-weight="700" text-anchor="start">A*가 생성한 경로</text>
<path d="M98 407L108 204" fill="none" stroke="#2b73b8" stroke-width="1" stroke-dasharray=""/>
<path d="M310 199L92 302" fill="none" stroke="#a83b38" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<rect x="46" y="303" width="38" height="25" rx="8" fill="#dbe9f3" stroke="#2b73b8" stroke-width="1.5" stroke-dasharray=""/>
<text x="25" y="355" font-size="18" fill="#2b73b8" font-weight="700" text-anchor="start">BlueROV2</text>
<g transform="translate(330 190) rotate(154.75)"><rect x="-17" y="-7" width="34" height="14" rx="7" fill="#a83b38"/><path d="M-16 -7L-23 -13V13L-16 7" fill="#a83b38"/></g>
<text x="270" y="168" font-size="18" fill="#a83b38" font-weight="700" text-anchor="start">접근 중인 어뢰</text>
</g>
<g transform="translate(595 30)">
<rect x="0" y="0" width="460" height="470" rx="8" fill="#f6f9f7" stroke="#d5e1e8" stroke-width="1.5" stroke-dasharray=""/>
<text x="24" y="38" font-size="22" fill="#23774a" font-weight="700" text-anchor="start">DVO / 가까운 구간의 회피 경로</text>
<path d="M65 315L390 95" fill="none" stroke="#8795a1" stroke-width="2" stroke-dasharray="7 6"/>
