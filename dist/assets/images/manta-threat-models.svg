<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 555" role="img" aria-labelledby="title desc"><title id="title">같은 상황에서 A*와 DVO의 경로 생성 비교</title><desc id="desc">회피 방식 개념도. 동일한 기체, 위협, 목표와 임무 경로에서 A*는 예측한 위험 영역을 피해 목표까지 경로를 탐색합니다. DVO는 위협의 예상 이동과 여러 이동 후보를 평가해 짧은 회피 경로를 생성합니다. 실제 실험 좌표나 축척이 아닌 설명용 평면 도식입니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="context-stroke"/></marker></defs>
<rect width="1100" height="555" fill="white"/><g font-family="Pretendard, Noto Sans KR, Arial, sans-serif" fill="#193044">
<g transform="translate(45 30)">
<rect x="0" y="0" width="460" height="470" rx="8" fill="#f7f9fb" stroke="#d5e1e8" stroke-width="1.5" stroke-dasharray=""/>
<text x="24" y="38" font-size="22" fill="#2b73b8" font-weight="700" text-anchor="start">A* / 목표까지 이어지는 경로</text>
<path d="M65 315L390 95" fill="none" stroke="#8795a1" stroke-width="2" stroke-dasharray="7 6"/>
<text x="270" y="291" font-size="18" fill="#536574" font-weight="400" text-anchor="start">기존 임무 경로</text>
