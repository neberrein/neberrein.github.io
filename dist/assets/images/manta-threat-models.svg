<path d="M65 315L183 321" fill="none" stroke="#a1adb5" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/>
<path d="M65 315C56 281 57 245 72 214" fill="none" stroke="#23774a" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/>
