<path d="M220 340V363" fill="none" stroke="#2b73b8" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<text x="220" y="449" font-size="18" fill="#536574" font-weight="400" text-anchor="middle">nav_msgs/Path</text>
<path d="M220 465V497" fill="none" stroke="#536574" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="35" y="500" width="370" height="100" rx="8" fill="#f3f5f6" stroke="#bccbd5" stroke-width="1.5" stroke-dasharray=""/>
<text x="220" y="532" font-size="18" fill="#536574" font-weight="400" text-anchor="middle">Control module</text>
<text x="220" y="563" font-size="22" fill="#193044" font-weight="700" text-anchor="middle">Path following and control</text>
<text x="220" y="588" font-size="17" fill="#536574" font-weight="400" text-anchor="middle">PathFollower, PPID, thruster control</text>
