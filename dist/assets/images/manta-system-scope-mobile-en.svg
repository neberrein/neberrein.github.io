<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 720" role="img" aria-labelledby="title desc"><title id="title">MANTA system connections and my scope</title><desc id="desc">My module takes BlueROV2 and torpedo states, decides whether to evade, generates a path with A* or DVO, and outputs the avoidance path. The path-following and control module turns it into Gazebo vehicle motion.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="context-stroke"/></marker></defs>
<rect width="440" height="720" fill="white"/><g font-family="Pretendard, Arial, sans-serif" fill="#193044">
<rect x="20" y="20" width="190" height="60" rx="8" fill="#edf2f5" stroke="#bccbd5" stroke-width="1.5" stroke-dasharray=""/>
<rect x="230" y="20" width="190" height="60" rx="8" fill="#edf2f5" stroke="#bccbd5" stroke-width="1.5" stroke-dasharray=""/>
<text x="115" y="57" font-size="21" fill="#193044" font-weight="700" text-anchor="middle">BlueROV2 state</text>
<text x="325" y="57" font-size="21" fill="#193044" font-weight="700" text-anchor="middle">Torpedo state</text>
<path d="M115 80V103H220M325 80V103H220V133" fill="none" stroke="#536574" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/>
<rect x="20" y="135" width="400" height="330" rx="8" fill="#f4f8fb" stroke="#2b73b8" stroke-width="1.5" stroke-dasharray=""/>
<text x="40" y="171" font-size="22" fill="#2b73b8" font-weight="700" text-anchor="start">My scope</text>
<rect x="95" y="194" width="250" height="60" rx="8" fill="#fff" stroke="#2b73b8" stroke-width="1.5" stroke-dasharray=""/>
<text x="220" y="232" font-size="23" fill="#2b73b8" font-weight="700" text-anchor="middle">Evade or continue</text>
<rect x="95" y="280" width="250" height="60" rx="8" fill="#fff" stroke="#2b73b8" stroke-width="1.5" stroke-dasharray=""/>
<text x="220" y="318" font-size="23" fill="#2b73b8" font-weight="700" text-anchor="middle">A* or DVO</text>
<rect x="95" y="366" width="250" height="60" rx="8" fill="#fff" stroke="#2b73b8" stroke-width="1.5" stroke-dasharray=""/>
<text x="220" y="404" font-size="23" fill="#2b73b8" font-weight="700" text-anchor="middle">Avoidance path</text>
