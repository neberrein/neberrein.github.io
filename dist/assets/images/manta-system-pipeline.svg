<g text-anchor="middle" fill="#172b3b" font-size="18"><text x="101" y="114" font-size="15" fill="#536574">INPUT</text><text x="101" y="149">BlueROV2 / Torpedo</text><text x="101" y="180">Odometry</text><text x="301" y="126" font-weight="700">Velocity Estimation</text><text x="301" y="163">position diff</text><text x="301" y="193">+ EMA 0.3</text><text x="501" y="126" font-weight="700">Future Threat</text><text x="501" y="153" font-weight="700">Corridor</text><text x="501" y="193" font-size="16">4.0 s / 1.5 m / max 32</text><text x="701" y="114" font-weight="700">Decision</text><text x="701" y="147" font-size="17">NORMAL / AVOID</text><text x="701" y="178" font-size="16">engage 30 m</text><text x="701" y="202" font-size="16">recover 33 m / hit 1 m</text><text x="901" y="137" font-weight="700">Path Planning</text><text x="901" y="178">A* / Dynamic VO</text><text x="1100" y="114" font-size="15" fill="#536574">OUTPUT</text><text x="1100" y="155" font-size="17">/uuv/reference_path</text><text x="1100" y="188">회피 경로 출력</text></g>
