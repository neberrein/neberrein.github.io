<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
<title id="title">온보드 장치 구성과 데이터 연결 — 모바일</title><desc id="desc">화살표는 데이터 또는 명령의 전달 방향을, 흰 표시는 연결 방식을 나타냅니다.</desc>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2f63b4"/></marker><marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#138a98"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#697e91"/></marker></defs>
<style>text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;font-weight:650}.pill{fill:#fff;stroke:#c4d3e3;stroke-width:2}.pill-text{font-size:21px;fill:#53677c;font-weight:700}.label{font-size:23px;fill:#18345f}.muted{font-size:23px;fill:#53677c}</style>
<rect width="720" height="900" fill="#fff"/>
<rect x="210" y="30" width="300" height="110" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/>
