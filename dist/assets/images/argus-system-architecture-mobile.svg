<rect x="148" y="565" width="64" height="30" rx="15" class="pill"/><text x="180" y="587" text-anchor="middle" class="pill-text">PCIe</text>
<text x="120" y="620" text-anchor="end" class="label">입력 영상</text>
<text x="242" y="620" text-anchor="start" class="label">추론 결과</text>
