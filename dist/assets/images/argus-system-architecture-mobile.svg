<rect x="15" y="220" width="690" height="580" rx="14" fill="#edf3f8" stroke="#b8cbe0" stroke-width="2"/>
<path d="M330 140V398" fill="none" stroke="#2f63b4" stroke-width="3" marker-end="url(#blue)"/>
<path d="M390 400V142" fill="none" stroke="#697e91" stroke-width="3" marker-end="url(#gray)"/>
<text x="318" y="172" text-anchor="end" class="label">표적 선택 / 시작 / 중단</text>
<text x="402" y="172" text-anchor="start" class="muted">영상과 탐지, 추적 결과</text>
<text x="318" y="211" text-anchor="end" class="pill-text">MAVLink (UDP)</text>
<text x="402" y="211" text-anchor="start" class="pill-text">UDP (무선)</text>
