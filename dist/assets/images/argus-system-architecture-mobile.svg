<rect x="40" y="830" width="92" height="30" rx="15" fill="#2f63b4"/><text x="86" y="851" text-anchor="middle" font-size="18" fill="#fff">본인 담당</text>
<text x="146" y="843" text-anchor="start" font-size="22" fill="#18345f">YOLOX 학습과 NPU 최적화</text>
<text x="146" y="877" text-anchor="start" font-size="22" fill="#18345f">다중 표적 추적과 재획득</text>
