<text x="160" y="303" text-anchor="middle" font-size="29" fill="#18345f">LWIR 카메라</text><text x="160" y="340" text-anchor="middle" font-size="23" fill="#53677c">열화상 영상</text>
<path d="M160 358V398" fill="none" stroke="#2f63b4" stroke-width="3" marker-end="url(#blue)"/>
<rect x="176" y="363" width="68" height="30" rx="15" class="pill"/><text x="210" y="385" text-anchor="middle" class="pill-text">USB</text>
<rect x="60" y="400" width="600" height="120" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/>
<text x="360" y="440" text-anchor="middle" font-size="34" fill="#18345f">Raspberry Pi 5</text>
<text x="360" y="475" text-anchor="middle" font-size="24" fill="#53677c">영상 전처리와 추종 판단</text>
<text x="360" y="506" text-anchor="middle" font-size="24" fill="#2f63b4">UCMC 다중 표적 추적과 재획득</text>
