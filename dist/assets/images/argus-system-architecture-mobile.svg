<style>text{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;font-weight:650}</style>
<rect width="720" height="1320" fill="#fff"/>
<rect x="25" y="65" width="670" height="975" rx="12" fill="#edf3f8" stroke="#b8cbe0" stroke-width="2"/><text x="60" y="110" text-anchor="start" font-size="30" fill="#21457c">기체 탑재 장치</text><rect x="140" y="150" width="440" height="110" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/><text x="360" y="195" text-anchor="middle" font-size="36" fill="#18345f">LWIR 카메라</text><text x="360" y="237" text-anchor="middle" font-size="30" fill="#53677c">열화상 영상</text><rect x="140" y="345" width="440" height="135" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/><text x="360" y="393" text-anchor="middle" font-size="36" fill="#18345f">Raspberry Pi 5</text><text x="360" y="445" text-anchor="middle" font-size="30" fill="#53677c">전처리 / 추적 / 추종 판단</text><path d="M360 260V345" fill="none" stroke="#2f63b4" stroke-width="3"  marker-end="url(#blue)"/><text x="390" y="310" text-anchor="start" font-size="30" fill="#21457c">영상</text><rect x="170" y="605" width="380" height="120" rx="12" fill="#fff" stroke="#2f63b4" stroke-width="2"/><text x="360" y="652" text-anchor="middle" font-size="36" fill="#18345f">Hailo NPU</text><text x="360" y="697" text-anchor="middle" font-size="32" fill="#2f63b4">YOLOX 추론</text><path d="M285 480V605" fill="none" stroke="#2f63b4" stroke-width="3"  marker-end="url(#blue)"/><text x="265" y="542" text-anchor="end" font-size="28" fill="#21457c">입력 영상</text><path d="M435 605V480" fill="none" stroke="#2f63b4" stroke-width="3"  marker-end="url(#blue)"/><text x="455" y="568" text-anchor="start" font-size="28" fill="#21457c">추론 결과</text><rect x="140" y="860" width="440" height="120" rx="12" fill="#fff" stroke="#138a98" stroke-width="2"/><text x="360" y="910" text-anchor="middle" font-size="34" fill="#18345f">비행 제어기 / PX4</text><text x="360" y="951" text-anchor="middle" font-size="30" fill="#53677c">자세와 속도 제어</text><path d="M580 420H615V920H580" fill="none" stroke="#138a98" stroke-width="3"  marker-end="url(#teal)"/><text x="570" y="815" text-anchor="end" font-size="30" fill="#138a98">추종 명령 ↓</text><path d="M140 920H105V420H140" fill="none" stroke="#138a98" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#teal)"/><text x="150" y="785" text-anchor="start" font-size="30" fill="#138a98">↑ 비행 상태</text><rect x="140" y="1135" width="440" height="125" rx="12" fill="#fff" stroke="#cfdae5" stroke-width="2"/><text x="360" y="1185" text-anchor="middle" font-size="36" fill="#18345f">지상 통제기</text><text x="360" y="1230" text-anchor="middle" font-size="28" fill="#53677c">영상 확인 / 기록 / 운용 요청</text><path d="M200 1135V1090H60V375H140" fill="none" stroke="#2f63b4" stroke-width="3"  marker-end="url(#blue)"/><text x="150" y="1080" text-anchor="start" font-size="28" fill="#21457c">선택 / 시작 / 중단 ↑</text><path d="M580 370H665V1190H580" fill="none" stroke="#697e91" stroke-width="3"  marker-end="url(#gray)"/><text x="600" y="1030" text-anchor="end" font-size="28" fill="#53677c">영상과 상태 ↓</text>
